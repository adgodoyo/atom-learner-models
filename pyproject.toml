[project]
name = "atom-learner-models"
version = "1.0.0"
description = "ATOM: simulating a learner from their history with a population-trained belief over a person latent, and choosing what to ask them next."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Andrés Daniel Godoy Ortiz", email = "adgodoyo@gmail.com" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "torch>=2.2",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "beautifulsoup4>=4.12",
    "transformers>=4.50",
    "accelerate>=1.0",
    "huggingface-hub>=0.26",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "javalang>=0.13.0",
    "pyarrow>=25.0.0",
    "tree-sitter==0.20.4",
    "rapidfuzz>=3.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
baselines = ["pykt-toolkit>=0.0.38"]   # the AKT baseline
cloud = ["boto3>=1.34"]                # optional S3 upload of run outputs
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.uv]
package = true
