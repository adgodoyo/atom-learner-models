# EPIG planner replay on FA with the GRU filter's belief -- PRE-REGISTERED, frozen before
# the run, judged on VAL.
#
# This replay has all three repairs in place at once: the corrected (Jensen-gap) EPIG
# estimator, the repaired replay harness, and a query-independent belief on the rebuilt v2
# manifest. Each addresses one confound found in earlier versions of the replay: an
# underpowered design, a correctness label that mixes give-ups with failed attempts, and a
# distorted candidate window.

task: pl_3_evsi_proper
seed: 0

source:                    # the query-independent ("fixed") v2 GRU filter on the v2 substrate
  run_id: 20260809T232033-8908b1
  variant: fixed
  codec: artifacts/problem_codec_mean_L15.npz
  codec_dim: 45
  episode_hidden: 64
  filter_hidden: 64
  latent_dim: 32
  split: val

# Geometry held identical to the earlier recency-bounded replay so the two runs are
# comparable (median candidate position 63.7% of history rather than 13%, candidate->target
# distance ~112 events rather than ~287). The geometry is reported again regardless.
geometry:
  pool_lookback: 150
  candidate_w: 50
  n_target: 15
  min_length: 165
  n_codec_clusters: 8
  budget: 5
  k: 64

arms:
  policies: [greedy_evsi, random, max_entropy, max_epistemic]
  v_flavors: [jensen, total]   # BOTH value flavours on the identical pool under CRN -- the
                               # old-vs-new contrast is what licenses a mechanism sentence
                               # rather than just "the new estimator scores X"

# Margins are pre-registered as FRACTIONS OF MEASURED HEADROOM, never as absolute nats.
# The denominator comes from the belief-curve measurement (reports/pl_2b_belief_curves.md),
# which measured what a budget of randomly chosen questions can buy on this exact belief
# and substrate.
headroom:
  # Fixed cohort, 15 random questions: +0.0313 / +0.0214 / +0.0240 / +0.0131 nats at
  # t0 = 10 / 25 / 50 / 100. This replay's prefix is the learner's FULL history (far past
  # t0=100), so the applicable reference is the large-t end of that curve, and the budget is
  # 5 rather than 15 -- half the movement arrives by question 2-4, so ~5 questions is most
  # of what the curve offers.
  reference_nats: 0.0131
  reference_source: "PL-2b fixed-cohort curve at t0=100, 15 random questions"
  # A policy earns "beats random" only by capturing a stated FRACTION of that reference.
  min_fraction_of_headroom: 0.25
  require_ci_clear_of_zero: true

bootstrap_n: 5000
ci_alpha: 0.05
pilot_n: 5
max_learners: 500
